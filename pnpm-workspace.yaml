# pnpm 11 reads settings from this file, not from package.json or .npmrc.

# pnpm's default symlinked layout breaks Metro and native module resolution
# (Expo autolinking, CocoaPods), which expect a flat node_modules.
nodeLinker: hoisted

# unrs-resolver (pulled in by eslint-config-expo) needs its postinstall script to
# fetch the platform-native resolver binary.
allowBuilds:
  # @parcel/watcher (via Jest) only runs a build-from-source fallback; the prebuilt
  # platform binary ships as an optional dependency, so the script isn't needed.
  '@parcel/watcher': false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - jest-expo@58.0.14
